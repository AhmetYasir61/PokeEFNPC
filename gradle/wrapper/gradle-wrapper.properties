# Gradle 8.8: new enough to RUN on a Java 21 JDK, which is what most people have
# installed now, and still within what ForgeGradle 6 supports.
#
# This is separate from what the mod is COMPILED against. Forge 1.20.1 targets
# Java 17, so build.gradle pins a Java 17 toolchain; together with the
# foojay-resolver plugin in settings.gradle, Gradle fetches a JDK 17 for the
# compile step by itself. So the build works on a machine that only has Java 21,
# without anyone configuring a second JDK by hand.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.8-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists

plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'java'
}

version = "${mod_version}"
group = "${mod_group_id}"

base {
    archivesName = "${mod_id}-forge-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods { "${mod_id}" { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run-server')
            property 'forge.logging.console.level', 'debug'
            mods { "${mod_id}" { source sourceSets.main } }
        }
    }
}

repositories {
    flatDir { dirs 'libs' }
    maven { url = 'https://cursemaven.com' }
    // Simple Voice Chat publishes an api-only artifact here. It is the same API
    // the full mod ships, so compiling against it needs no jar in the repo.
    maven { url = 'https://maven.maxhenkel.de/repository/public' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Epic Fight and PokeFace are both reached through reflection only — see
    // compat/EpicFightBridge and compat/PokeFaceBridge. Neither is needed to
    // compile or to run. Drop the jars in libs/ and uncomment if you want IDE
    // completion while working on the bridges.
    // compileOnly fg.deobf("blank:epicfight:${epicfight_version}")
    // compileOnly fg.deobf("blank:pokeface:${pokeface_version}")

    // Simple Voice Chat, also optional at runtime. Unlike the two above this is
    // a real compile-time dependency, because the plugin has to implement SVC's
    // interfaces — reflection cannot satisfy an interface contract. It stays
    // safe because the ONLY class that touches these types is the plugin, and
    // the plugin is loaded by Simple Voice Chat itself: when the mod is absent,
    // nothing ever classloads it. See voice/NpcVoiceBridge for the guard the
    // rest of the mod goes through.
    compileOnly "de.maxhenkel.voicechat:voicechat-api:${voicechat_api_version}"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
        minecraft_version: minecraft_version, forge_version: forge_version,
        mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
        mod_authors: mod_authors, mod_license: mod_license,
        mod_group_id: mod_group_id
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

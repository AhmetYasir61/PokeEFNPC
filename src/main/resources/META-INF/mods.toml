modLoader="javafml"
loaderVersion="[47,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
A living medieval/fantasy population: NPCs that are born into a village,
claim a home, keep a daily routine, work their trade, run shops and guilds,
raise defences and fight for their lives when the monsters come.

Every NPC carries a mood that shows on its face — brows down and drawn in when
it is angry, brows raised and mouth turned down when it is sad — and plays
looping idle emotes appropriate to its role.

NPCs can also be talked to out loud through Simple Voice Chat, and answer in
their own voice, with speech recognition, speech synthesis and a language model
all running on your own machine — no account, no key, nothing leaving the
computer.

Epic Fight, PokeFace and Simple Voice Chat are all OPTIONAL. The mod loads and
plays fine without any of them: without Epic Fight the NPCs use vanilla combat,
without PokeFace they simply have no drawn face, and without Simple Voice Chat
they are talked to by typing.
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="[47,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.20.1,1.21)"
    ordering="NONE"
    side="BOTH"

# Optional. Declared only so load order is right WHEN present.
[[dependencies.${mod_id}]]
    modId="epicfight"
    mandatory=false
    versionRange="*"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="pokeface"
    mandatory=false
    versionRange="*"
    ordering="AFTER"
    side="BOTH"

# Optional. When present, NPCs hear players speak and answer aloud. The plugin
# that uses its API is loaded by Simple Voice Chat itself, so nothing in this
# mod classloads a voice chat type when the mod is absent.
[[dependencies.${mod_id}]]
    modId="voicechat"
    mandatory=false
    versionRange="*"
    ordering="AFTER"
    side="BOTH"
